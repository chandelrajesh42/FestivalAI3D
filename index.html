<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Indian Festival Photo Maker</title>
    
    <!-- Monetag Verification Meta Tag -->
    <meta name="monetag" content="f17ed5532ceba8d5beaf3548acd6ea90">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between">

    <!-- TOP BANNER AD with safe spacing -->
    <div class="w-full bg-white py-2 text-center border-b shadow-sm">
        <script>(function(s){s.dataset.zone='11829771',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
    </div>

    <!-- Main Container with extra top padding so ad never overlaps -->
    <main class="max-w-md mx-auto w-full p-4 pt-12 flex-grow">
        <div class="bg-white rounded-2xl shadow-xl p-5 mb-6 border border-gray-100">
            <h1 class="text-xl font-bold text-center text-red-600 mb-1">🎉 Indian Festival Photo Maker</h1>
            <p class="text-xs text-center text-gray-500 mb-4">Apna naam likhein aur har tyohar ki shandar photo banayein!</p>

            <!-- Festival Selector with Static Options -->
            <div class="mb-4">
                <label class="block text-sm font-semibold text-gray-700 mb-1">Tyohar Chunein (Select Festival):</label>
                <select id="festivalSelect" class="w-full p-2.5 border rounded-lg text-sm bg-gray-50 focus:ring-2 focus:ring-red-500 outline-none">
                    <option value="navratri1">🌺 Shardiya Navratri - Day 1 (Maa Shailputri)</option>
                    <option value="navratri2">🌺 Shardiya Navratri - Day 2 (Maa Brahmacharini)</option>
                    <option value="navratri3">🌺 Shardiya Navratri - Day 3 (Maa Chandraghanta)</option>
                    <option value="navratri4">🌺 Shardiya Navratri - Day 4 (Maa Kushmanda)</option>
                    <option value="navratri5">🌺 Shardiya Navratri - Day 5 (Maa Skandamata)</option>
                    <option value="navratri6">🌺 Shardiya Navratri - Day 6 (Maa Katyayani)</option>
                    <option value="navratri7">🌺 Shardiya Navratri - Day 7 (Maa Kalaratri)</option>
                    <option value="navratri8">🌺 Shardiya Navratri - Day 8 (Maa Mahagauri / Ashtami)</option>
                    <option value="navratri9">🌺 Shardiya Navratri - Day 9 (Maa Siddhidatri / Navami)</option>
                    <option value="dussehra">🏹 Vijayadashami (Dussehra)</option>
                    <option value="karwa">🌕 Karva Chauth</option>
                    <option value="diwali">🪔 Diwali (Deepawali)</option>
                    <option value="bhaidooj">🎁 Bhai Dooj</option>
                    <option value="chhath">☀️ Chhath Puja</option>
                    <option value="gurunanak">🪯 Guru Nanak Jayanti</option>
                    <option value="christmas">🎄 Christmas</option>
                    <option value="newyear">🎆 Happy New Year</option>
                    <option value="lohri">🔥 Lohri</option>
                    <option value="makarsankranti">🪁 Makar Sankranti / Pongal</option>
                    <option value="republic">🇮🇳 Republic Day / Independence Day</option>
                    <option value="shivratri">🔱 Maha Shivratri</option>
                    <option value="holi">🎨 Holi</option>
                    <option value="rakhi">🧵 Raksha Bandhan</option>
                    <option value="janmashtami">🦚 Shri Krishna Janmashtami</option>
                    <option value="ganesh">🐘 Ganesh Chaturthi</option>
                    <option value="eid">🌙 Eid-ul-Fitr / Eid al-Adha</option>
                </select>
            </div>

            <!-- User Name Input -->
            <div class="mb-4">
                <label class="block text-sm font-semibold text-gray-700 mb-1">Aapka Naam (Your Name):</label>
                <input type="text" id="userName" placeholder="Jaise: Rahul Sharma" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-red-500 outline-none">
            </div>

            <!-- Create Photo Button -->
            <button onclick="generatePhoto()" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-lg shadow-md transition duration-200 text-sm">
                ✨ Photo Banayein & Pre-load Karein
            </button>
        </div>

        <!-- Preview & Share Section -->
        <div id="resultSection" class="bg-white rounded-2xl shadow-xl p-5 hidden text-center border border-gray-100">
            <h2 class="text-md font-semibold text-gray-700 mb-3">Aapki Photo Taiyar Hai! 👇</h2>
            <div class="flex justify-center mb-4">
                <!-- Canvas for Generating Image -->
                <canvas id="photoCanvas" width="500" height="500" class="w-full max-w-[320px] rounded-lg shadow border"></canvas>
            </div>
            
            <!-- Share Button which triggers Popunder and Shares with Link -->
            <div>
                <button onclick="sharePhotoWithAd()" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg shadow-md text-sm transition duration-200 flex items-center justify-center gap-2">
                    📤 WhatsApp Par Share Karein & Link Bhejein
                </button>
            </div>
        </div>
    </main>

    <!-- BOTTOM BANNER AD -->
    <div class="w-full bg-white py-2 text-center border-t shadow-sm mt-auto">
        <script>(function(s){s.dataset.zone='11829771',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
    </div>

    <!-- JavaScript Logic & Festival Database -->
    <script>
        // Festival Themes Configuration Database
        const festivalsData = {
            navratri1: { title: "Maa Shailputri", subText: "Shardiya Navratri Day 1", bgGradient: ["#ff3366", "#990033"], textColor: "#fff" },
            navratri2: { title: "Maa Brahmacharini", subText: "Shardiya Navratri Day 2", bgGradient: ["#ff9933", "#cc6600"], textColor: "#fff" },
            navratri3: { title: "Maa Chandraghanta", subText: "Shardiya Navratri Day 3", bgGradient: ["#ffcc00", "#ff6600"], textColor: "#000" },
            navratri4: { title: "Maa Kushmanda", subText: "Shardiya Navratri Day 4", bgGradient: ["#33cc33", "#006600"], textColor: "#fff" },
            navratri5: { title: "Maa Skandamata", subText: "Shardiya Navratri Day 5", bgGradient: ["#ffcc00", "#999900"], textColor: "#000" },
            navratri6: { title: "Maa Katyayani", subText: "Shardiya Navratri Day 6", bgGradient: ["#ff3399", "#660033"], textColor: "#fff" },
            navratri7: { title: "Maa Kalaratri", subText: "Shardiya Navratri Day 7", bgGradient: ["#330066", "#000000"], textColor: "#ffd700" },
            navratri8: { title: "Maa Mahagauri", subText: "Maha Ashtami Shubhkamnayein", bgGradient: ["#ff99ff", "#990099"], textColor: "#fff" },
            navratri9: { title: "Maa Siddhidatri", subText: "Mahanavami & Dussehra ki Shubhkamnayein", bgGradient: ["#ff3300", "#990000"], textColor: "#fff" },
            dussehra: { title: "Happy Dussehra", subText: "Asatya par Satya ki Jeet", bgGradient: ["#cc0000", "#ff9933"], textColor: "#fff" },
            karwa: { title: "Happy Karva Chauth", subText: "Akhand Saubhagyavati", bgGradient: ["#cc0066", "#660033"], textColor: "#fff" },
            diwali: { title: "Happy Diwali", subText: "Shubh Deepawali", bgGradient: ["#ff9933", "#cc0000"], textColor: "#fff" },
            bhaidooj: { title: "Happy Bhai Dooj", subText: "Bhai-Behan ka Prem", bgGradient: ["#800080", "#ff00ff"], textColor: "#fff" },
            chhath: { title: "Happy Chhath Puja", subText: "Surya Dev ki Aaradhna", bgGradient: ["#ff6600", "#ffcc00"], textColor: "#000" },
            gurunanak: { title: "Guru Nanak Jayanti", subText: "Gurpurab ki Shubhkamnayein", bgGradient: ["#002db3", "#3399ff"], textColor: "#fff" },
            christmas: { title: "Merry Christmas", subText: "Joy to the World", bgGradient: ["#cc0000", "#138808"], textColor: "#fff" },
            newyear: { title: "Happy New Year", subText: "Naye Saal ki Shubhkamnayein", bgGradient: ["#000000", "#434343"], textColor: "#ffd700" },
            lohri: { title: "Happy Lohri", subText: "Tyohar Khushiyon Ka", bgGradient: ["#ff3300", "#ff9900"], textColor: "#fff" },
            makarsankranti: { title: "Happy Makar Sankranti", subText: "Patang Utsav ki Shubhkamnayein", bgGradient: ["#0099ff", "#ffff33"], textColor: "#000" },
            republic: { title: "Jai Hind", subText: "Desh Bhakti ki Shubhkamnayein", bgGradient: ["#ff9933", "#138808"], textColor: "#000" },
            shivratri: { title: "Maha Shivratri", subText: "Har Har Mahadev", bgGradient: ["#000066", "#333333"], textColor: "#ffd700" },
            holi: { title: "Happy Holi", subText: "Rangon Ka Tyohar", bgGradient: ["#800080", "#ff00ff"], textColor: "#fff" },
            rakhi: { title: "Happy Raksha Bandhan", subText: "Bhai-Behan ke Pyar ka Tyohar", bgGradient: ["#003366", "#ff3366"], textColor: "#fff" },
            janmashtami: { title: "Happy Janmashtami", subText: "Hathi Ghoda Palki, Jai Kanhaiya Lal Ki", bgGradient: ["#000099", "#00cccc"], textColor: "#fff" },
            ganesh: { title: "Happy Ganesh Chaturthi", subText: "Ganpati Bappa Morya", bgGradient: ["#ff6600", "#990000"], textColor: "#fff" },
            eid: { title: "Eid Mubarak", subText: "Khushiyon Bhari Eid", bgGradient: ["#006600", "#003300"], textColor: "#ffd700" }
        };

        // Monetag Popunder Popup Ad Trigger Function
        function triggerMonetagPopup() {
            try {
                const s = document.createElement('script');
                s.dataset.zone = '11829758';
                s.src = 'https://al5sm.com/tag.min.js';
                document.body.appendChild(s);
            } catch (e) {
                console.log("Ad load error", e);
            }
        }

        let generatedDataUrl = "";

        function generatePhoto() {
            const nameInput = document.getElementById("userName").value.trim();
            const festivalKey = document.getElementById("festivalSelect").value;

            if (!nameInput) {
                alert("Kripya apna naam darj karein!");
                return;
            }

            const theme = festivalsData[festivalKey] || festivalsData["diwali"];

            // Canvas Rendering
            const canvas = document.getElementById("photoCanvas");
            const ctx = canvas.getContext("2d");

            let gradient = ctx.createLinearGradient(0, 0, 0, 500);
            if(festivalKey === 'republic') {
                gradient.addColorStop(0, "#ff9933");
                gradient.addColorStop(0.5, "#ffffff");
                gradient.addColorStop(1, "#138808");
            } else {
                gradient.addColorStop(0, theme.bgGradient[0]);
                gradient.addColorStop(1, theme.bgGradient[1]);
            }

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 500, 500);

            // Border Design
            ctx.strokeStyle = "#ffd700";
            ctx.lineWidth = 14;
            ctx.strokeRect(10, 10, 480, 480);

            ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
            ctx.lineWidth = 2;
            ctx.strokeRect(22, 22, 456, 456);

            // Festival Title
            ctx.fillStyle = (festivalKey === 'republic') ? '#000' : theme.textColor;
            ctx.font = "bold 32px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(theme.title, 250, 130);

            // Subtext
            ctx.font = "20px sans-serif";
            ctx.fillText(theme.subText, 250, 180);

            // Decorative line
            ctx.strokeStyle = "#ffd700";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(140, 215);
            ctx.lineTo(360, 215);
            ctx.stroke();

            // User Name Box
            ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
            ctx.roundRect ? ctx.beginPath(), ctx.roundRect(40, 290, 420, 120, 15), ctx.fill() : ctx.fillRect(40, 290, 420, 120);

            ctx.fillStyle = "#ffffff";
            ctx.font = "16px sans-serif";
            ctx.fillText("✨ Shubh Shubhkamnayein ✨", 250, 330);

            ctx.fillStyle = "#ffd700";
            ctx.font = "bold 34px sans-serif";
            ctx.fillText(nameInput, 250, 375);

            // Show Result Section
            document.getElementById("resultSection").classList.remove("hidden");

            // Save Data URL for Sharing
            generatedDataUrl = canvas.toDataURL("image/png");
            
            // Scroll to result smoothly
            document.getElementById("resultSection").scrollIntoView({ behavior: 'smooth' });
        }

        // Share Function with Popunder Ad and Website Link
        async function sharePhotoWithAd() {
            // 1. Trigger Popunder Ad First
            triggerMonetagPopup();

            const siteUrl = window.location.href;
            const shareText = "🌟 Maine apni festival greeting photo yahan banayi! Aap bhi apna naam daal kar bilkul aisi free photo banayein: " + siteUrl;

            // Small timeout to allow ad script to fire smoothly before opening share window
            setTimeout(async () => {
                if (navigator.share && generatedDataUrl) {
                    try {
                        const res = await fetch(generatedDataUrl);
                        const blob = await res.blob();
                        const file = new File([blob], "festival-greeting.png", { type: "image/png" });

                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            await navigator.share({
                                title: 'Festival Greeting',
                                text: shareText,
                                files: [file],
                            });
                            return;
                        }
                    } catch (err) {
                        console.log("Native share failed, using WhatsApp fallback");
                    }
                }

                // Fallback: WhatsApp Direct Link with Site Link included
                const whatsappUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(shareText);
                window.open(whatsappUrl, '_blank');
            }, 500);
        }
    </script>
</body>
</html>
