<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>भारतीय त्योहार विशिंग साइट - नाम वाली फोटो बनाएं</title>
    
    <!-- Monetag Meta Verification (आपके पुराने कोड से) -->
    <meta name="monetag" content="10756784d5df68d9f10da955677d2a58">

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            text-align: center;
            color: #333;
        }
        header {
            background: linear-gradient(135deg, #ff9933, #ffffff, #128807);
            padding: 25px 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        header h1 {
            margin: 0;
            font-size: 26px;
            color: #d84315;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }
        header p {
            margin: 5px 0 0 0;
            font-weight: bold;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 15px;
        }
        /* Banner Ad Container Styles */
        .ad-container {
            margin: 20px auto;
            padding: 5px;
            max-width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .form-section {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }
        select:focus, input[type="text"]:focus {
            border-color: #ff9933;
        }
        .gen-btn {
            background: linear-gradient(135deg, #ff9933, #ff5500);
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 10px rgba(255, 85, 0, 0.3);
            transition: 0.2s;
        }
        .gen-btn:hover {
            transform: translateY(-2px);
        }
        .hidden {
            display: none !important;
        }
        #resultSection {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-top: 20px;
        }
        canvas {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .share-btn {
            background-color: #25D366;
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 14px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.4);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <header>

    <div class="container">

        <!-- इनपुट फॉर्म सेक्शन -->
        <div class="form-section">
            <div class="form-group">
                <label for="festivalSelect">🚩 त्योहार या नवरात्रि का दिन चुनें:</label>
                <select id="festivalSelect">
                    <!-- नवरात्रि के पूरे 9 दिन -->
                    <option value="navratri1">🚩 नवरात्रि दिन 1: मां शैलपुत्री</option>
                    <option value="navratri2">🚩 नवरात्रि दिन 2: मां ब्रह्मचारिणी</option>
                    <option value="navratri3">🚩 नवरात्रि दिन 3: मां चंद्रघंटा</option>
                    <option value="navratri4">🚩 नवरात्रि दिन 4: मां कुष्मांडा</option>
                    <option value="navratri5">🚩 नवरात्रि दिन 5: मां स्कंदमाता</option>
                    <option value="navratri6">🚩 नवरात्रि दिन 6: मां कात्यायनी</option>
                    <option value="navratri7">🚩 नवरात्रि दिन 7: मां कालरात्रि</option>
                    <option value="navratri8">🚩 नवरात्रि दिन 8: मां महागौरी (महा अष्टमी)</option>
                    <option value="navratri9">🚩 नवरात्रि दिन 9: मां सिद्धिदात्री (महानवमी)</option>
                    
                    <!-- अन्य मुख्य त्योहार -->
                    <option value="dussehra">🏹 विजयदशमी (दशहरा)</option>
                    <option value="karwa">🌙 करवा चौथ</option>
                    <option value="diwali" selected>🪔 दीपावली (Diwali)</option>
                    <option value="bhaidooj">👫 भाई दूज</option>
                    <option value="chhath">☀️ छठ पूजा</option>
                    <option value="gurunanak">☬ गुरु नानक जयंती</option>
                    <option value="christmas">🎄 मैरी क्रिसमस</option>
                    <option value="newyear">🎆 नया साल (Happy New Year)</option>
                    <option value="lohri">🔥 लोहड़ी</option>
                    <option value="makarsankranti">🪁 मकर संक्रांति</option>
                    <option value="republic">🇮🇳 गणतंत्र दिवस (26 जनवरी)</option>
                    <option value="shivratri">🔱 महाशिवरात्रि</option>
                    <option value="holi">🎨 होली की हार्दिक बधाई</option>
                    <option value="rakhi">🛡️ रक्षाबंधन</option>
                    <option value="janmashtami">👑 कृष्ण जन्माष्टमी</option>
                    <option value="ganesh">🐘 गणेश चतुर्थी</option>
                    <option value="eid">🌙 ईद मुबारक</option>
                </select>
            </div>

            <div class="form-group">
                <label for="userName">✍️ अपना नाम दर्ज करें:</label>
                <input type="text" id="userName" placeholder="यहाँ अपना नाम लिखें..." maxlength="25">
            </div>

            <button class="gen-btn" onclick="generatePhoto()">✨ फोटो बनाएं</button>
        </div>

        <!-- रिजल्ट और प्रीव्यू सेक्शन -->
        <div id="resultSection" class="hidden">
            <h3>👇 आपकी बधाई फोटो तैयार है 👇</h3>
            <canvas id="photoCanvas" width="500" height="500"></canvas>
            
            <button class="share-btn" onclick="sharePhotoWithAd()">
                🟢 व्हाट्सएप पर शेयर करें
            </button>
        </div>

        <!-- 2. BOTTOM BANNER AD (Zone 8932405) -->
        <div class="ad-container">
            <script data-cfasync="false" async src="//://al5sm.com"></script>
        </div>
    </div>
