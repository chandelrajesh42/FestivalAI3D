            { id: "navratri4", name: "☀️ Navratri Day 4 - Maa Kushmanda", category: "navratri", title: "Maa Kushmanda", subText: "Chaturthi Navratra - Brahmanda Srijan", symbol: "☀️ 🪷", mata: "Maa Kushmanda (कूष्मांडा)" },
            { id: "navratri5", name: "👶 Navratri Day 5 - Maa Skandamata", category: "navratri", title: "Maa Skandamata", subText: "Panchami Navratra - Skanda Mata", symbol: "👶 🦁", mata: "Maa Skandamata (स्कंदमाता)" },
            { id: "navratri6", name: "⚔️ Navratri Day 6 - Maa Katyayani", category: "navratri", title: "Maa Katyayani", subText: "Shashthi Navratra - Mahishasurmardini", symbol: "⚔️ 🛡️", mata: "Maa Katyayani (कात्यायनी)" },
            { id: "navratri7", name: "⚡ Navratri Day 7 - Maa Kalaratri", category: "navratri", title: "Maa Kalaratri", subText: "Saptami Navratra - Shubhamkari", symbol: "⚡ 🔥", mata: "Maa Kalaratri (कालरात्रि)" },
            { id: "navratri8", name: "🌸 Navratri Day 8 - Maa Mahagauri", category: "navratri", title: "Maa Mahagauri", subText: "Ashtami Navratra - Kanya Pujan", symbol: "🌸 🪔", mata: "Maa Mahagauri (महागauri)" },
            { id: "navratri9", name: "🔱 Navratri Day 9 - Maa Siddhidatri", category: "navratri", title: "Maa Siddhidatri", subText: "Maha Navami - Sarva Siddhi Daayani", symbol: "🔱 ✨", mata: "Maa Siddhidatri (सिद्धिदात्री)" },

            // Other Major Indian Festivals
            { id: "dussehra", name: "🏹 Dussehra (Vijayadashami)", category: "navratri", title: "Happy Dussehra", subText: "Asatya par Satya ki Vijay", symbol: "🏹 🔥", mata: "Vijayadashami Utsav" },
            { id: "diwali", name: "🪔 Diwali (Deepawali)", category: "diwali", title: "Happy Diwali", subText: "Festival of Lights - Shubh Deepawali", symbol: "🪔 ✨", mata: "Maa Laxmi & Shri Ganesha" },
            { id: "dhanteras", name: "🪙 Dhanteras", category: "diwali", title: "Happy Dhanteras", subText: "Kuber Dev & Laxmi Pujan", symbol: "🪙 🪔", mata: "Dhanvantari & Kuber Dev" },
            { id: "karwachauth", name: "🌕 Karwa Chauth", category: "diwali", title: "Happy Karwa Chauth", subText: "Akhand Saubhagya Vrat", symbol: "🌕 💍", mata: "Karwa Mata Vrat" },
            { id: "bhaidooj", name: "🎁 Bhai Dooj", category: "general", title: "Happy Bhai Dooj", subText: "Bhai-Behan ke Prem ka Tyohar", symbol: "🎁 🤝", mata: "Yamraj & Yamuna Sneha" },
            { id: "chhath", name: "🌅 Chhath Puja", category: "diwali", title: "Happy Chhath Puja", subText: "Surya Dev & Chhath Maiya Ki Jai", symbol: "🌅 🥥", mata: "Chhath Maiya & Surya Dev" },
            { id: "gurunanak", name: "🪯 Guru Nanak Jayanti", category: "general", title: "Gurpurab Vadhai", subText: "Guru Nanak Dev Ji Jayanti", symbol: "ੴ ✨", mata: "Guru Nanak Dev Ji" },
            { id: "christmas", name: "🎄 Christmas", category: "general", title: "Merry Christmas", subText: "Joy to the World & Santa Blessings", symbol: "🎄 🎅", mata: "Santa Claus Blessings" },
            { id: "newyear", name: "🎆 New Year 2027", category: "diwali", title: "Happy New Year 2027", subText: "Naye Saal ki Hardik Shubhkamnayein", symbol: "🎆 🎉", mata: "Nav Varsh 2027" },
            { id: "sankranti", name: "🪁 Makar Sankranti / Pongal", category: "general", title: "Happy Makar Sankranti", subText: "Til Gul Ghod God Bola", symbol: "🪁 🌾", mata: "Surya Uttarayan Utsav" },
            { id: "republic", name: "🇮🇳 Republic Day", category: "republic", title: "Happy Republic Day", subText: "Jai Hind - Vande Mataram", symbol: "🇮🇳 🦚", mata: "Bharat Mata Ki Jai" },
            { id: "shivratri", name: "🔱 Maha Shivratri", category: "diwali", title: "Happy Maha Shivratri", subText: "Om Namah Shivaya - Har Har Mahadev", symbol: "🔱 🐍", mata: "Bholenath Shiv Shankar" },
            { id: "holi", name: "🎨 Holi", category: "general", title: "Happy Holi", subText: "Rangon Ka Tyohar - Bura Na Mano Holi Hari", symbol: "🎨 💧", mata: "Rangotsav Holi" },
            { id: "ramnavami", name: "🏹 Ram Navami", category: "navratri", title: "Happy Ram Navami", subText: "Jai Siya Ram - Maryada Purushottam", symbol: "🏹 🚩", mata: "Bhagwan Shri Ram" },
            { id: "rakhi", name: "🧵 Raksha Bandhan", category: "general", title: "Happy Raksha Bandhan", subText: "Bhai Behan ka Pavan Tyohar", symbol: "🧵 💖", mata: "Raksha Bandhan Sneha" },
            { id: "janmashtami", name: "🦚 Krishna Janmashtami", category: "diwali", title: "Happy Janmashtami", subText: "Hathi Ghoda Palki, Jai Kanhaiya Lal Ki", symbol: "🦚 🪈", mata: "Shri Krishna Janmotsav" },
            { id: "ganesh", name: "🐘 Ganesh Chaturthi", category: "general", title: "Happy Ganesh Chaturthi", subText: "Ganpati Bappa Morya, Mangal Murti Morya", symbol: "🐘 🍬", mata: "Shri Ganesha" }
        ];

        // Populate Festival Dropdown
        function loadFestivals() {
            const select = document.getElementById("festivalSelect");
            select.innerHTML = "";
            festivalsData.forEach(f => {
                let opt = document.createElement("option");
                opt.value = f.id;
                opt.textContent = f.name;
                select.appendChild(opt);
            });
        }

        window.onload = loadFestivals;

        // Monetag Popunder Popup Ad Trigger
        function triggerMonetagPopups() {
            try {
                const s1 = document.createElement('script');
                s1.dataset.zone = '11829758';
                s1.src = 'https://al5sm.com/tag.min.js';
                document.body.appendChild(s1);
            } catch (e) {
                console.log("Popup ad error", e);
            }
        }

        // Generate Decorated Canvas Photo with Specific Navratri Mata details & graphics
        function generatePhoto() {
            const nameInput = document.getElementById("userName").value.trim();
            const festivalKey = document.getElementById("festivalSelect").value;

            if (!nameInput) {
                alert("Kripya apna naam darj karein!");
                return;
            }

            const theme = festivalsData.find(f => f.id === festivalKey) || festivalsData[0];
            const canvas = document.getElementById("photoCanvas");
            const ctx = canvas.getContext("2d");

            ctx.clearRect(0, 0, 500, 500);

            // 1. Theme Background Styling
            if (theme.category === 'diwali') {
                let bgGrad = ctx.createLinearGradient(0, 0, 0, 500);
                bgGrad.addColorStop(0, "#051630");
                bgGrad.addColorStop(0.5, "#0b2545");
                bgGrad.addColorStop(1, "#13315c");
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, 500, 500);

                drawBokehCircles(ctx);
                drawMandalaBase(ctx, 250, 360, 180, "#1d4ed8", "#60a5fa");
                drawDiya(ctx, 250, 290);

            } else if (theme.category === 'navratri') {
                // Rich divine orange/gold background for Navratri days
                let bgGrad = ctx.createLinearGradient(0, 0, 0, 500);
                bgGrad.addColorStop(0, "#802b00");
                bgGrad.addColorStop(0.5, "#b33c00");
                bgGrad.addColorStop(1, "#e64d00");
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, 500, 500);

                drawMandalaOverlay(ctx);
                drawMarigoldGarlands(ctx);

                // Specific Divine Goddess Circle Emblem in Center
                ctx.save();
                ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
                ctx.beginPath();
                ctx.arc(250, 240, 75, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#ffd700";
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.restore();

                // Draw Goddess Symbol/Icon inside circle
                ctx.fillStyle = "#ffffff";
                ctx.font = "38px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(theme.symbol.split(" ")[1] || "🔱", 250, 252);

            } else if (theme.category === 'republic') {
                let bgGrad = ctx.createLinearGradient(0, 0, 0, 500);
                bgGrad.addColorStop(0, "#ff9933");
                bgGrad.addColorStop(0.5, "#ffffff");
                bgGrad.addColorStop(1, "#138808");
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, 500, 500);
            } else {
                let bgGrad = ctx.createLinearGradient(0, 0, 0, 500);
                bgGrad.addColorStop(0, "#4a044e");
                bgGrad.addColorStop(0.5, "#701a75");
                bgGrad.addColorStop(1, "#86198f");
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, 500, 500);

                drawBokehCircles(ctx);
            }

            // 2. Golden Border Frame
            ctx.strokeStyle = "#ffd700";
            ctx.lineWidth = 10;
            ctx.strokeRect(10, 10, 480, 480);

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.strokeRect(18, 18, 464, 464);

            drawCornerOrnaments(ctx);

            // 3. Header & Specific Mata Name
            ctx.font = "28px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(theme.symbol.split(" ")[0] || "🌺", 250, 62);

            ctx.fillStyle = (theme.category === 'republic') ? '#000' : '#ffffff';
            ctx.font = "bold 26px sans-serif";
            ctx.shadowColor = "rgba(0, 0, 0, 0.8)";
            ctx.shadowBlur = 8;
            ctx.fillText(theme.mata || theme.title, 250, 102);

            // Subtitle / Day Details
            ctx.font = "15px sans-serif";
            ctx.fillStyle = "#ffd700";
            ctx.fillText(theme.subText, 250, 130);
            ctx.shadowBlur = 0;

            // 4. User Greeting Banner Box at bottom
            ctx.fillStyle = "rgba(0, 0, 0, 0.80)";
            if (ctx.roundRect) {
                ctx.beginPath();
                ctx.roundRect(35, 375, 430, 100, 12);
                ctx.fill();
            } else {
                ctx.fillRect(35, 375, 430, 100);
            }

            ctx.strokeStyle = "#ffd700";
            ctx.lineWidth = 2;
            if (ctx.roundRect) {
                ctx.beginPath();
                ctx.roundRect(35, 375, 430, 100, 12);
                ctx.stroke();
            } else {
                ctx.strokeRect(35, 375, 430, 100);
            }

            // User Name & Watermark inside box
            ctx.fillStyle = "#ffdf00";
            ctx.font = "bold 13px sans-serif";
            ctx.fillText("🌟 Shubh Shubhkamnayein 🌟", 250, 398);

            ctx.fillStyle = "#00ffff";
            ctx.font = "bold 26px sans-serif";
            ctx.shadowColor = "rgba(0,0,0,0.9)";
            ctx.shadowBlur = 6;
            ctx.fillText(nameInput, 250, 432);
            ctx.shadowBlur = 0;

            ctx.fillStyle = "#cbd5e1";
            ctx.font = "11px sans-serif";
            ctx.fillText("festivalAI3d.com | Aap bhi aisi photo banayein", 250, 458);

            // Show Result Section
            document.getElementById("resultSection").classList.remove("hidden");
            document.getElementById("resultSection").scrollIntoView({ behavior: 'smooth' });
        }

        // Helper Canvas Drawings
        function drawBokehCircles(ctx) {
            const colors = ["rgba(255, 215, 0, 0.3)", "rgba(255, 255, 255, 0.2)", "rgba(255, 140, 0, 0.25)"];
            for (let i = 0; i < 25; i++) {
                ctx.fillStyle = colors[i % colors.length];
                ctx.beginPath();
                let x = Math.random() * 500;
                let y = Math.random() * 500;
                let r = Math.random() * 20 + 5;
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawMandalaBase(ctx, cx, cy, radius, color1, color2) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.strokeStyle = color2;
            ctx.lineWidth = 3;
            for (let i = 0; i < 16; i++) {
                ctx.beginPath();
                ctx.arc(0, 0, radius, (i * Math.PI) / 8, ((i + 0.5) * Math.PI) / 8);
                ctx.stroke();
            }
            ctx.fillStyle = color1;
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.7, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawDiya(ctx, x, y) {
            ctx.fillStyle = "#1e40af";
            ctx.beginPath();
            ctx.ellipse(x, y + 15, 55, 25, 0, 0, Math.PI);
            ctx.fill();
            ctx.strokeStyle = "#ffd700";
            ctx.lineWidth = 3;
            ctx.stroke();

            let grad = ctx.createRadialGradient(x, y - 20, 2, x, y - 20, 25);
            grad.addColorStop(0, "#ffffff");
            grad.addColorStop(0.4, "#facc15");
            grad.addColorStop(1, "#ea580c");
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(x, y - 45);
            ctx.quadraticCurveTo(x + 18, y - 20, x, y - 5);
            ctx.quadraticCurveTo(x - 18, y - 20, x, y - 45);
            ctx.fill();
        }

        function drawMarigoldGarlands(ctx) {
            ctx.fillStyle = "#ff8c00";
            for (let x = 15; x < 490; x += 25) {
                ctx.beginPath();
                ctx.arc(x, 25, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#ffd700";
                ctx.beginPath();
                ctx.arc(x, 25, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#ff8c00";
            }
        }

        function drawMandalaOverlay(ctx) {
            ctx.strokeStyle = "rgba(255, 215, 0, 0.15)";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(250, 250, 180, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(250, 250, 120, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawCornerOrnaments(ctx) {
            ctx.fillStyle = "#ffd700";
            ctx.fillRect(8, 8, 30, 8);
            ctx.fillRect(8, 8, 8, 30);
            ctx.fillRect(462, 8, 30, 8);
            ctx.fillRect(484, 8, 8, 30);
            ctx.fillRect(8, 484, 30, 8);
            ctx.fillRect(8, 462, 8, 30);
            ctx.fillRect(462, 484, 30, 8);
            ctx.fillRect(484, 462, 8, 30);
        }

        // WhatsApp Share with site link and call to action
        async function sharePhotoWithAd() {
            triggerMonetagPopups();

            const canvas = document.getElementById("photoCanvas");
            const siteUrl = window.location.href;
            const shareText = "🌟 Maine apni tyohar ki shandar greeting photo festivalAI3d par banayi! Aap bhi aisi photo bnayen:\n" + siteUrl;

            canvas.toBlob(async (blob) => {
                const file = new File([blob], "festival-greeting.png", { type: "image/png" });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            title: 'Festival Greeting Photo',
                            text: shareText,
                            files: [file]
                        });
                        return;
                    } catch (error) {
                        console.log("Share canceled or failed", error);
                    }
                }

                const whatsappUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(shareText);
                window.open(whatsappUrl, '_blank');
            }, 'image/png');
        }
    </script>
