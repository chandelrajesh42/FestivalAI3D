            <!-- Create Photo Button -->
            <button onclick="generatePhoto()" class="w-full bg-gradient-to-r from-red-600 to-orange-600 hover:from-red-700 hover:to-orange-700 text-white font-semibold py-3 rounded-lg shadow-md transition duration-200 text-sm">
                ✨ Shandar Photo Banayein

        <!-- Preview & Share Section -->
        <div id="resultSection" class="bg-white rounded-2xl shadow-xl p-5 hidden text-center">
            <h2 class="text-md font-semibold text-gray-700 mb-3">Aapki Photo Taiyar Hai! 👇</h2>
            <div class="flex justify-center mb-4">
                <!-- Canvas for Generating Decorated Image -->
                <canvas id="photoCanvas" width="500" height="500" class="w-full max-w-[300px] rounded-lg shadow-lg border-2 border-amber-400"></canvas>
            </div>
            
            <!-- Share & Download Buttons -->
            <div class="space-y-3">
                <button onclick="sharePhotoWithAd()" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg shadow-md text-sm transition duration-200 flex items-center justify-center gap-2">
                    📤 WhatsApp Par Photo Share Karein
                </button>
                <a id="downloadBtn" download="festivalAI3d-greeting.png" class="block w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg shadow-md text-sm transition duration-200 text-center">
                    📥 Photo Download Karein
                </a>
            </div>
        </div>
    </main>

    <!-- BOTTOM BANNER AD -->
    <div class="w-full bg-white py-1 text-center border-t shadow-sm mt-auto">
        <script>(function(s){s.dataset.zone='11829771',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
    </div>

    <!-- JavaScript Logic & Complete Festivals & Navratri Database -->
    <script>
        const festivalsData = [
            // 9 Navratri Days
            { id: "navratri1", name: "🌺 Navratri Day 1 - Maa Shailputri", title: "Maa Shailputri", subText: "Prathama Navratra Shubhkamnayein", bgGradient: ["#b8860b", "#ff8c00"], textColor: "#fff", symbol: "🌺 🪔" },
            { id: "navratri2", name: "🌿 Navratri Day 2 - Maa Brahmacharini", title: "Maa Brahmacharini", subText: "Dvitiya Navratra Shubhkamnayein", bgGradient: ["#006400", "#228b22"], textColor: "#fff", symbol: "🌿 🪔" },
            { id: "navratri3", name: "🌙 Navratri Day 3 - Maa Chandraghanta", title: "Maa Chandraghanta", subText: "Tritiya Navratra Shubhkamnayein", bgGradient: ["#483d8b", "#6a5acd"], textColor: "#fff", symbol: "🌙 🪔" },
            { id: "navratri4", name: "☀️ Navratri Day 4 - Maa Kushmanda", title: "Maa Kushmanda", subText: "Chaturthi Navratra Shubhkamnayein", bgGradient: ["#ff4500", "#ff8c00"], textColor: "#fff", symbol: "☀️ 🪔" },
            { id: "navratri5", name: "👶 Navratri Day 5 - Maa Skandamata", title: "Maa Skandamata", subText: "Panchami Navratra Shubhkamnayein", bgGradient: ["#8b0000", "#dc143c"], textColor: "#fff", symbol: "👶 🪔" },
            { id: "navratri6", name: "⚔️ Navratri Day 6 - Maa Katyayani", title: "Maa Katyayani", subText: "Shashthi Navratra Shubhkamnayein", bgGradient: ["#b22222", "#ff4500"], textColor: "#fff", symbol: "⚔️ 🪔" },
            { id: "navratri7", name: "⚡ Navratri Day 7 - Maa Kalaratri", title: "Maa Kalaratri", subText: "Saptami Navratra Shubhkamnayein", bgGradient: ["#00008b", "#191970"], textColor: "#ffd700", symbol: "⚡ 🪔" },
            { id: "navratri8", name: "🌸 Navratri Day 8 - Maa Mahagauri (Ashtami)", title: "Maa Mahagauri", subText: "Durga Ashtami & Kanya Pujan", bgGradient: ["#ff1493", "#ff69b4"], textColor: "#fff", symbol: "🌸 🪔" },
            { id: "navratri9", name: "🔱 Navratri Day 9 - Maa Siddhidatri (Navami)", title: "Maa Siddhidatri", subText: "Maha Navami Shubhkamnayein", bgGradient: ["#800080", "#9932cc"], textColor: "#ffd700", symbol: "🔱 🪔" },

            // Other Major Indian Festivals
            { id: "dussehra", name: "🏹 Dussehra (Vijayadashami)", title: "Happy Dussehra", subText: "Asatya par Satya ki Vijay", bgGradient: ["#cc0000", "#ff6600"], textColor: "#fff", symbol: "🏹 🔥" },
            { id: "karwachauth", name: "🌕 Karwa Chauth", title: "Happy Karwa Chauth", subText: "Akhand Saubhagya Vrat", bgGradient: ["#800020", "#ff1493"], textColor: "#ffd700", symbol: "🌕 💍" },
            { id: "dhanteras", name: "🪙 Dhanteras", title: "Happy Dhanteras", subText: "Kuber Dev & Laxmi Pujan", bgGradient: ["#b8860b", "#ffd700"], textColor: "#000", symbol: "🪙 🪔" },
            { id: "diwali", name: "🪔 Diwali (Deepawali)", title: "Happy Diwali", subText: "Shubh Deepawali & Laxmi Kripa", bgGradient: ["#ff4500", "#ff8c00"], textColor: "#ffd700", symbol: "🪔 ✨" },
            { id: "bhaidooj", name: "🎁 Bhai Dooj", title: "Happy Bhai Dooj", subText: "Bhai-Behan ke Prem ka Tyohar", bgGradient: ["#800080", "#da70d6"], textColor: "#fff", symbol: "🎁 🤝" },
            { id: "chhath", name: "🌅 Chhath Puja", title: "Happy Chhath Puja", subText: "Surya Dev & Chhath Maiya Ki Jai", bgGradient: ["#ff8c00", "#daa520"], textColor: "#000", symbol: "🌅 🥥" },
            { id: "gurunanak", name: "🪯 Guru Nanak Jayanti", title: "Gurpurab Vadhai", subText: "Guru Nanak Dev Ji Jayanti", bgGradient: ["#00008b", "#1e90ff"], textColor: "#ffd700", symbol: "ੴ ✨" },
            { id: "christmas", name: "🎄 Christmas", title: "Merry Christmas", subText: "Joy to the World & Santa Blessings", bgGradient: ["#8b0000", "#006400"], textColor: "#fff", symbol: "🎄 🎅" },
            { id: "newyear", name: "🎆 New Year 2027", title: "Happy New Year 2027", subText: "Naye Saal ki Hardik Shubhkamnayein", bgGradient: ["#111111", "#333333"], textColor: "#ffd700", symbol: "🎆 🎉" },
            { id: "sankranti", name: "🪁 Makar Sankranti / Pongal", title: "Happy Makar Sankranti", subText: "Til Gul Ghod God Bola", bgGradient: ["#ff8c00", "#ffd700"], textColor: "#000", symbol: "🪁 🌾" },
            { id: "republic", name: "🇮🇳 Republic Day", title: "Happy Republic Day", subText: "Jai Hind - Vande Mataram", bgGradient: ["#ff9933", "#ffffff", "#138808"], textColor: "#000", symbol: "🇮🇳 🦚" },
            { id: "shivratri", name: "🔱 Maha Shivratri", title: "Happy Maha Shivratri", subText: "Om Namah Shivaya - Har Har Mahadev", bgGradient: ["#2f4f4f", "#111111"], textColor: "#00ffff", symbol: "🔱 🐍" },
            { id: "holi", name: "🎨 Holi", title: "Happy Holi", subText: "Rangon Ka Tyohar - Bura Na Mano Holi Hai", bgGradient: ["#800080", "#ff1493"], textColor: "#fff", symbol: "🎨 💧" },
            { id: "ramnavami", name: "🏹 Ram Navami", title: "Happy Ram Navami", subText: "Jai Siya Ram - Maryada Purushottam", bgGradient: ["#ff8c00", "#ff4500"], textColor: "#ffd700", symbol: "🏹 🚩" },
            { id: "rakhi", name: "🧵 Raksha Bandhan", title: "Happy Raksha Bandhan", subText: "Bhai Behan ka Pavan Tyohar", bgGradient: ["#ff1493", "#800080"], textColor: "#fff", symbol: "🧵 💖" },
            { id: "janmashtami", name: "🦚 Krishna Janmashtami", title: "Happy Janmashtami", subText: "Hathi Ghoda Palki, Jai Kanhaiya Lal Ki", bgGradient: ["#00008b", "#4169e1"], textColor: "#ffd700", symbol: "🦚 🪈" },
            { id: "ganesh", name: "🐘 Ganesh Chaturthi", title: "Happy Ganesh Chaturthi", subText: "Ganpati Bappa Morya, Mangal Murti Morya", bgGradient: ["#ff8c00", "#ff4500"], textColor: "#ffd700", symbol: "🐘 🍬" }
        ];

        // Populate Festival Dropdown
        function loadFestivals() {
            const select = document.getElementById("festivalSelect");
            select.innerHTML = "";
            festivalsData.forEach(f => {
                let opt = document.createElement("option");
                opt.value = f.id;
                opt.textContent = f.name;
                select.appendChild(opt);
            });
        }

        window.onload = loadFestivals;

        // Monetag Popunder Popup Ad Trigger (Zone: 11829758)
        function triggerMonetagPopup() {
            try {
                const s = document.createElement('script');
                s.dataset.zone = '11829758';
                s.src = 'https://al5sm.com/tag.min.js';
                document.body.appendChild(s);
            } catch (e) {
                console.log("Popunder error", e);
            }
        }

        // Generate Decorated Canvas Photo
        function generatePhoto() {
            const nameInput = document.getElementById("userName").value.trim();
            const festivalKey = document.getElementById("festivalSelect").value;

            if (!nameInput) {
                alert("Kripya apna naam darj karein!");
                return;
            }

            const theme = festivalsData.find(f => f.id === festivalKey) || festivalsData[0];
            const canvas = document.getElementById("photoCanvas");
            const ctx = canvas.getContext("2d");

            // 1. Rich Gradient Background
            let gradient = ctx.createLinearGradient(0, 0, 0, 500);
            if(festivalKey === 'republic') {
                gradient.addColorStop(0, "#ff9933");
                gradient.addColorStop(0.5, "#ffffff");
                gradient.addColorStop(1, "#138808");
            } else {
                gradient.addColorStop(0, theme.bgGradient[0]);
                gradient.addColorStop(1, theme.bgGradient[1]);
            }

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 500, 500);

            // 2. Decorative Outer & Inner Golden Borders
            ctx.strokeStyle = "#ffd700";
            ctx.lineWidth = 12;
            ctx.strokeRect(12, 12, 476, 476);

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.strokeRect(22, 22, 456, 456);

            // Corner Flower Ornaments
            drawCornerOrnaments(ctx);

            // 3. Festival Symbol Header
            ctx.font = "38px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(theme.symbol, 250, 75);

            // 4. Festival Title
            ctx.fillStyle = (festivalKey === 'republic') ? '#000' : theme.textColor;
            ctx.font = "bold 32px sans-serif";
            ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
            ctx.shadowBlur = 6;
            ctx.fillText(theme.title, 250, 130);

            // 5. Subtitle
            ctx.font = "18px sans-serif";
            ctx.fillText(theme.subText, 250, 170);
            ctx.shadowBlur = 0; // reset shadow

            // 6. Ornamental Divider Line
            ctx.strokeStyle = "#ffd700";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(100, 200);
            ctx.lineTo(400, 200);
            ctx.stroke();

            // Center decorative sparkle
            ctx.fillStyle = "#ffd700";
            ctx.font = "20px sans-serif";
            ctx.fillText("✦ ✧ ✦ ✧ ✦", 250, 230);

            // 7. User Name Banner Box
            ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
            if (ctx.roundRect) {
                ctx.beginPath();
                ctx.roundRect(40, 280, 420, 140, 15);
                ctx.fill();
            } else {
                ctx.fillRect(40, 280, 420, 140);
            }
            
            ctx.strokeStyle = "#ffd700";
            ctx.lineWidth = 3;
            if (ctx.roundRect) {
                ctx.beginPath();
                ctx.roundRect(40, 280, 420, 140, 15);
                ctx.stroke();
            } else {
                ctx.strokeRect(40, 280, 420, 140);
            }

            // Courtesy Text inside Box
            ctx.fillStyle = "#ffdf00";
            ctx.font = "bold 16px sans-serif";
            ctx.fillText("✨ Shubh Shubhkamnayein ✨", 250, 320);

            ctx.fillStyle = "#ffffff";
            ctx.font = "14px sans-serif";
            ctx.fillText("By festivalAI3d / Nivedak:", 250, 345);

            // User Name
            ctx.fillStyle = "#00ffff";
            ctx.font = "bold 30px sans-serif";
            ctx.shadowColor = "rgba(0, 0, 0, 0.8)";
            ctx.shadowBlur = 8;
            ctx.fillText(nameInput, 250, 390);
            ctx.shadowBlur = 0;

            // Show Result Section
            document.getElementById("resultSection").classList.remove("hidden");
            const dataUrl = canvas.toDataURL("image/png");
            document.getElementById("downloadBtn").href = dataUrl;
            document.getElementById("resultSection").scrollIntoView({ behavior: 'smooth' });
        }

        // Helper to draw corners
        function drawCornerOrnaments(ctx) {
            ctx.fillStyle = "#ffd700";
            ctx.fillRect(10, 10, 25, 8);
            ctx.fillRect(10, 10, 8, 25);
            ctx.fillRect(465, 10, 25, 8);
            ctx.fillRect(482, 10, 8, 25);
            ctx.fillRect(10, 482, 25, 8);
            ctx.fillRect(10, 465, 8, 25);
            ctx.fillRect(465, 482, 25, 8);
            ctx.fillRect(482, 465, 8, 25);
        }

        // Share Function with Web Share API (Shares Image + Text directly to WhatsApp)
        async function sharePhotoWithAd() {
            triggerMonetagPopup();

            const canvas = document.getElementById("photoCanvas");
            const siteUrl = window.location.href;
            const shareText = "🌟 Maine apni tyohar ki shandar greeting photo festivalAI3d par banayi! Aap bhi apna naam daal kar bilkul aisi free photo banayein:\n" + siteUrl;

            canvas.toBlob(async (blob) => {
                const file = new File([blob], "festival-greeting.png", { type: "image/png" });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            title: 'Festival Greeting Photo',
                            text: shareText,
                            files: [file]
                        });
                        return;
                    } catch (error) {
                        console.log("Share canceled or failed", error);
                    }
                }

                // Fallback for browsers not supporting direct file sharing
                const link = document.createElement('a');
                link.download = 'festival-greeting.png';
                link.href = canvas.toDataURL("image/png");
                link.click();

                setTimeout(() => {
                    const whatsappUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(shareText);
                    window.open(whatsappUrl, '_blank');
                }, 800);
            }, 'image/png');
        }
    </script>
</body>
